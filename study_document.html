"What is the worst-case time complexity of Merge Sort?":
`<p>Merge Sort's worst-case time complexity is <strong>O(n log n)</strong> — the same as best and average case. It always divides into halves (log n levels) and merges in O(n) per level. This makes it the preferred choice when guaranteed performance is needed.</p>`,

"Define stable sorting algorithm. Give one example.":
`<p>A <strong>stable sort</strong> preserves the relative order of elements with equal keys. If a[i] = a[j] and i &lt; j before sorting, then a[i] still comes before a[j] after sorting.</p>
<p>Example: <strong>Merge Sort</strong> — equal elements from the left subarray are always placed before those from the right subarray during merge, preserving original order.</p>`,

"What is linear probing?":
`<p>In <strong>linear probing</strong>, when a collision occurs at index h, we probe h+1, h+2, h+3, ... (modulo table size) until an empty slot is found.</p>
<div class="code-block">h(k, i) = (h(k) + i) % m   where i = 0, 1, 2, ...</div>
<p>Disadvantage: Primary clustering — long runs of filled slots form, degrading performance.</p>`,

"State the time complexity of Heap Sort.":
`<p>Heap Sort: <strong>O(n log n)</strong> for all cases (best, average, worst).</p>
<p>Building the heap: O(n). Extracting n elements: O(n log n). Space: O(1) in-place.</p>`,

"What is quadratic probing?":
`<p>In <strong>quadratic probing</strong>, the probe sequence uses a quadratic function to avoid primary clustering:</p>
<div class="code-block">h(k, i) = (h(k) + c1*i + c2*i²) % m</div>
<p>Common form: h(k, i) = (h(k) + i²) % m. Reduces primary clustering but may cause secondary clustering.</p>`,

"What is a pivot in Quick Sort?":
`<p>The <strong>pivot</strong> is a chosen element used to partition the array into two halves — elements less than the pivot go left; elements greater go right. Common choices: first element, last element, median-of-three, or random element.</p>`,

"How do you choose pivot element in quick sort?":
`<p>Common pivot selection strategies:</p>
<p><strong>1. First/Last element</strong> — simple but O(n²) for sorted arrays.</p>
<p><strong>2. Random pivot</strong> — reduces worst-case probability.</p>
<p><strong>3. Median-of-three</strong> — median of first, middle, last element. Best practical choice, avoids sorted-input worst case.</p>`,

"What is base case in recursion?":
`<p>The <strong>base case</strong> is the condition in a recursive function that <strong>stops the recursion</strong> — it returns a result directly without making another recursive call.</p>
<p>Every recursive function must have at least one base case, otherwise it runs infinitely. Example: factorial(0) = 1 is the base case for factorial.</p>`,

"What is a deque (double-ended queue)?":
`<p>A <strong>deque</strong> (Double-Ended Queue) allows insertion and deletion from <strong>both front and rear</strong>.</p>
<p>Operations: pushFront, pushRear, popFront, popRear, peekFront, peekRear. Used in: sliding window algorithms, palindrome checking, scheduling. Implemented using a doubly linked list or circular array.</p>`,

"What is the time complexity of tower of Hanoi?":
`<p>Tower of Hanoi with n disks requires <strong>2ⁿ − 1 moves</strong>, giving time complexity <strong>O(2ⁿ)</strong> — exponential.</p>
<p>Recurrence: T(n) = 2T(n-1) + 1. Each move of n disks requires two calls for n-1 disks plus one disk move.</p>`,

"Define prefix expression with an example.":
`<p><strong>Prefix (Polish Notation):</strong> Operator comes <strong>before</strong> its operands.</p>
<div class="code-block">Infix:  (A + B) * C
Prefix: * + A B C

Evaluate: + A B → A+B, then * (A+B) C → (A+B)*C ✓</div>`,

"What is memoisation in recursion?":
`<p><strong>Memoisation</strong> is an optimisation technique that stores (caches) the results of expensive recursive calls and returns the cached result when the same inputs occur again.</p>
<div class="code-block">// Without memo: fib(5) recalculates fib(3) multiple times
// With memo:
int[] memo = new int[n+1];
int fib(int n) {
    if (n &lt;= 1) return n;
    if (memo[n] != 0) return memo[n]; // cached
    memo[n] = fib(n-1) + fib(n-2);
    return memo[n];
}</div>
<p>Reduces Fibonacci from O(2ⁿ) to O(n).</p>`,

"Write algorithm for checking balanced parentheses using a stack.":
`<div class="code-block">isBalanced(str):
  stack = empty
  for each char c in str:
    if c is '(', '{', or '[': push(c)
    else if c is ')', '}', or ']':
      if stack is empty: return false
      top = pop()
      if (c==')' and top!='(') or
         (c=='}' and top!='{') or
         (c==']' and top!='['): return false
  return stack.isEmpty()

Example: "({[]})" → balanced ✓
Example: "({[})" → not balanced ✗</div>`,

// Practice Set 5 answers
"What is Big Theta notation?":
`<p><strong>Big Theta (Θ)</strong> provides a <strong>tight bound</strong> — both upper and lower bounds — on an algorithm's complexity.</p>
<p>f(n) = Θ(g(n)) means f grows <em>exactly as fast as</em> g(n): ∃ c₁, c₂ > 0, n₀ such that c₁·g(n) ≤ f(n) ≤ c₂·g(n) for all n ≥ n₀.</p>
<p>Example: Merge Sort is Θ(n log n) — it is always n log n regardless of input.</p>`,

"Define a forest in graph theory.":
`<p>A <strong>forest</strong> is an acyclic undirected graph — it may consist of <strong>multiple disconnected trees</strong>.</p>
<p>A single connected tree is a special case of a forest. If a forest has n nodes and k components, it has exactly n−k edges.</p>`,

"What is the time complexity of searching in a balanced BST?":
`<p><strong>O(log n)</strong> — a balanced BST has height ≈ log₂(n), so search visits at most log₂(n) nodes.</p>
<p>An unbalanced BST degrades to O(n). AVL trees and Red-Black trees guarantee O(log n).</p>`,

"Define space complexity.":
`<p><strong>Space complexity</strong> is the total memory an algorithm uses as a function of input size, including input storage, auxiliary/temporary storage, and call stack for recursion.</p>
<p>Expressed in Big O: O(1) = constant, O(n) = linear, O(n²) = quadratic. Example: Merge Sort uses O(n) extra space for the temp array.</p>`,

"What is heapification?":
`<p><strong>Heapification</strong> (heapify) is the process of rearranging elements to satisfy the heap property. Two types:</p>
<p><strong>Heapify-up (sift-up):</strong> After insertion, bubble new element up to its correct position.</p>
<p><strong>Heapify-down (sift-down):</strong> After deletion (extract-min/max), push root down to restore heap property. Time: O(log n).</p>`,

"Define topological ordering.":
`<p>A <strong>topological ordering</strong> of a Directed Acyclic Graph (DAG) is a linear ordering of vertices such that for every edge (u → v), vertex u appears before v.</p>
<p>Algorithms: Kahn's (BFS-based, uses in-degree) and DFS-based. Used for: task scheduling, build systems (make), course prerequisites.</p>`,

"Write Java code to reverse a linked list iteratively.":
`<div class="code-block">Node reverse(Node head) {
    Node prev = null;
    Node curr = head;
    while (curr != null) {
        Node next = curr.next;  // save next
        curr.next = prev;       // reverse link
        prev = curr;            // advance prev
        curr = next;            // advance curr
    }
    return prev;  // new head
}
// Example: 1→2→3→4→null becomes 4→3→2→1→null
// Time: O(n), Space: O(1)</div>`,

"Write a complete Java program for a Binary Search Tree with: insert, search, delete (all 3 cases), in-order traversal. Test by inserting 15,10,20,8,12,17,25. Delete 10 and show the result.":
`<div class="code-block">class BST {
    class Node { int data; Node left, right; Node(int d){data=d;} }
    Node root;

    void insert(int data) { root = insertRec(root, data); }
    Node insertRec(Node n, int data) {
        if (n == null) return new Node(data);
        if (data &lt; n.data) n.left = insertRec(n.left, data);
        else if (data &gt; n.data) n.right = insertRec(n.right, data);
        return n;
    }

    boolean search(int data) { return searchRec(root, data); }
    boolean searchRec(Node n, int data) {
        if (n == null) return false;
        if (data == n.data) return true;
        return data &lt; n.data ? searchRec(n.left, data) : searchRec(n.right, data);
    }

    void delete(int data) { root = deleteRec(root, data); }
    Node deleteRec(Node n, int data) {
        if (n == null) return null;
        if (data &lt; n.data) { n.left = deleteRec(n.left, data); }
        else if (data &gt; n.data) { n.right = deleteRec(n.right, data); }
        else { // Found node to delete
            if (n.left == null) return n.right;  // Case 1&2
            if (n.right == null) return n.left;  // Case 2
            // Case 3: two children — find in-order successor
            Node succ = n.right;
            while (succ.left != null) succ = succ.left;
            n.data = succ.data;
            n.right = deleteRec(n.right, succ.data);
        }
        return n;
    }

    void inorder(Node n) {
        if (n == null) return;
        inorder(n.left); System.out.print(n.data + " "); inorder(n.right);
    }
}

// Test: insert 15,10,20,8,12,17,25
// In-order before delete: 8 10 12 15 17 20 25
// Delete 10 (has two children: 8 and 12)
//   In-order successor of 10 = 12
//   Replace 10 with 12, delete 12 from right subtree
// In-order after delete 10: 8 12 15 17 20 25
// BST after:        15
//                  /  \
//                12    20
//               /     /  \
//              8     17   25</div>`,
