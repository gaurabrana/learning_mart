<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT 238 · Data Structure & Algorithms · Study Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --bg2: #eceae3;
  --bg3: #e2dfd6;
  --card: #ffffff;
  --card2: #f9f8f5;
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --text: #1a1a2e;
  --text2: #4a4a6a;
  --text3: #8888a8;
  --accent: #4f46e5;
  --accent2: #6d64ff;
  --accent-bg: rgba(79,70,229,0.08);
  --green: #059669;
  --amber: #d97706;
  --coral: #dc2626;
  --blue: #2563eb;
  --pink: #db2777;
  --teal: #0d9488;
  --r: 12px;
  --r2: 8px;
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.05);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
}

/* ── HERO ── */
.hero {
  padding: 40px 16px 28px;
  max-width: 900px;
  margin: 0 auto;
  text-align: center;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 1.5px solid rgba(79,70,229,0.25);
  padding: 5px 14px;
  border-radius: 99px;
  margin-bottom: 16px;
  background: rgba(79,70,229,0.06);
}
.hero-tag .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(0.7)} }

.hero h1 {
  font-family: 'Nunito', sans-serif;
  font-size: clamp(26px, 5vw, 48px);
  font-weight: 800;
  line-height: 1.1;
  color: var(--text);
  margin-bottom: 10px;
}
.hero h1 em {
  font-style: normal;
  color: var(--accent);
}
.hero p {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.7;
  max-width: 520px;
  margin: 0 auto 20px;
}
.hero-meta {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.hero-stat {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 18px;
  min-width: 80px;
  box-shadow: var(--shadow);
}
.hero-stat .val {
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}
.hero-stat .lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* ── LAYOUT ── */
.layout {
  display: flex;
  flex-direction: column;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 0 80px;
}

/* ── TOP NAV TABS ── */
.tab-nav {
  background: var(--card);
  border-bottom: 2px solid var(--border);
  padding: 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.tab-nav::-webkit-scrollbar { display: none; }
.tab-nav-inner {
  display: flex;
  gap: 2px;
  min-width: max-content;
}
.tab-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 12px 14px;
  border: none;
  background: transparent;
  color: var(--text3);
  font-family: 'Nunito', sans-serif;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn .cnt {
  font-size: 10px;
  background: var(--bg2);
  color: var(--text3);
  padding: 1px 6px;
  border-radius: 99px;
}
.tab-btn.active .cnt { background: var(--accent-bg); color: var(--accent); }

/* ── TOPIC QUICK ACCESS ── */
.topic-strip {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.topic-strip::-webkit-scrollbar { display: none; }
.topic-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  white-space: nowrap;
  cursor: pointer;
  text-decoration: none;
  transition: all .15s;
}
.topic-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.topic-chip .pct { color: var(--text3); font-weight: 400; }

/* ── CONTENT AREA ── */
.content { padding: 16px; }

/* ── PAPER HEADER ── */
.paper-header {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.paper-header h2 {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 10px;
}
.paper-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  color: var(--text2);
  background: var(--bg2);
}

/* ── GROUP SECTION ── */
.group-section { margin-bottom: 20px; }
.group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  padding: 8px 0;
  border-bottom: 2px solid var(--border);
}
.group-badge {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 99px;
  letter-spacing: 0.05em;
}
.g-a { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
.g-b { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.g-c { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.g-d { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
.group-note { font-size: 12px; color: var(--text3); font-weight: 600; }

/* ── QUESTION CARD ── */
.q-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 8px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color .15s;
}
.q-card:hover { border-color: rgba(79,70,229,0.25); }
.q-card.open { border-color: var(--accent); }

.q-top {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  align-items: start;
  padding: 14px 14px 14px 14px;
  cursor: pointer;
  user-select: none;
}
.q-num {
  font-size: 12px;
  color: var(--text3);
  font-weight: 700;
  padding-top: 1px;
  font-family: 'JetBrains Mono', monospace;
}
.q-right { display: flex; flex-direction: column; gap: 8px; }
.q-text { font-size: 14px; color: var(--text); line-height: 1.6; font-weight: 600; }
.q-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: var(--r2);
  border: 1.5px solid var(--border2);
  background: var(--card2);
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover { background: var(--bg2); }
.btn-show { border-color: rgba(79,70,229,0.35); color: var(--accent); background: rgba(79,70,229,0.05); }
.btn-show:hover { background: rgba(79,70,229,0.12); border-color: var(--accent); }
.btn-yt { border-color: rgba(220,38,38,0.25); color: #b91c1c; background: rgba(220,38,38,0.04); }
.btn-yt:hover { background: rgba(220,38,38,0.1); border-color: rgba(220,38,38,0.5); }

/* ── ANSWER PANEL ── */
.ans-panel {
  display: none;
  border-top: 1.5px solid var(--border);
  background: #fafaf8;
}
.ans-panel.open { display: block; }
.ans-panel-inner { padding: 14px 14px 14px 52px; }
.ans-label {
  font-size: 10px;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.ans-body {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.85;
}
.ans-body p { margin-bottom: 6px; }
.ans-body strong { color: var(--text); font-weight: 700; }
.code-block {
  background: #1e1e2e;
  border-radius: var(--r2);
  padding: 12px 14px;
  margin: 10px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #a6e3a1;
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre;
}
.ans-section-title {
  display: block;
  font-size: 11px;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 10px 0 4px;
}

/* ── YT SECTION ── */
.yt-section {
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.yt-section h3 {
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.yt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 6px;
}
.yt-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  text-decoration: none;
  transition: all .15s;
}
.yt-chip:hover { border-color: rgba(220,38,38,0.4); color: #991b1b; background: rgba(220,38,38,0.05); }
.yt-chip .yt-icon {
  width: 20px; height: 20px;
  background: #dc2626;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.yt-chip .yt-icon svg { width: 10px; height: 10px; fill: white; }
.yt-chip .yt-label { font-size: 11px; line-height: 1.3; }

/* ── OVERVIEW ── */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.ov-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
  cursor: pointer;
  transition: all .2s;
  box-shadow: var(--shadow);
}
.ov-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(79,70,229,0.12); }
.ov-card h3 { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.ov-card p { font-size: 11px; color: var(--text3); line-height: 1.5; margin-bottom: 8px; }
.ov-pill { font-size: 10px; font-weight: 700; color: var(--text2); background: var(--bg2); padding: 2px 7px; border-radius: 99px; border: 1px solid var(--border); margin-right: 4px; }
.ov-meta { display: flex; flex-wrap: wrap; gap: 4px; }

/* ── FREQ BARS ── */
.freq-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.freq-section h3 { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 14px; }
.freq-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.freq-name { font-size: 12px; font-weight: 600; color: var(--text2); min-width: 170px; max-width: 170px; }
.freq-track { flex: 1; height: 7px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.freq-bar2 { height: 100%; border-radius: 4px; transition: width .8s cubic-bezier(.4,0,.2,1); }
.freq-pct { font-size: 11px; font-weight: 700; color: var(--text3); min-width: 32px; text-align: right; }

/* ── ANALYSIS SECTION ── */
.analysis-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
.analysis-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  box-shadow: var(--shadow);
}
.analysis-card h4 { font-size: 13px; font-weight: 800; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.analysis-card ul { list-style: none; }
.analysis-card ul li { font-size: 12px; color: var(--text2); padding: 4px 0; border-bottom: 1px solid var(--border); display: flex; align-items: start; gap: 6px; line-height: 1.5; }
.analysis-card ul li:last-child { border: none; }
.analysis-card ul li::before { content: '→'; color: var(--accent); font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.priority-badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
.p-high { background: #fee2e2; color: #991b1b; }
.p-med { background: #fef3c7; color: #92400e; }
.p-low { background: #d1fae5; color: #065f46; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 20px; right: 16px;
  background: var(--text);
  border-radius: var(--r);
  padding: 10px 16px;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  z-index: 9999;
  transform: translateY(100px);
  opacity: 0;
  transition: all .3s;
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }

/* ── MOBILE RESPONSIVE ── */
@media (max-width: 600px) {
  .hero { padding: 28px 12px 20px; }
  .content { padding: 12px; }
  .freq-name { min-width: 120px; max-width: 120px; font-size: 11px; }
  .overview-grid { grid-template-columns: 1fr 1fr; }
  .yt-grid { grid-template-columns: repeat(2, 1fr); }
  .ans-panel-inner { padding: 12px 12px 12px 40px; }
  .analysis-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
// ── ANSWERS DATABASE ─────────────────────────────────────────────
// Each key is the question text (normalised). Value is pre-written answer HTML.
const ANS = {

// ── COMPLEXITY ──
"Define Asymptotic notations.":
`<p>Asymptotic notations describe the <strong>time or space complexity</strong> of an algorithm as input size (n) grows toward infinity — ignoring constants and lower-order terms.</p>
<p><strong>Big O (O)</strong> — Upper bound (worst case). E.g., O(n²) for Bubble Sort.</p>
<p><strong>Omega (Ω)</strong> — Lower bound (best case). E.g., Ω(n) for linear search.</p>
<p><strong>Theta (Θ)</strong> — Tight bound (average case). E.g., Θ(n log n) for Merge Sort.</p>`,

"Why do we always do worst case analysis?":
`<p>Worst-case analysis guarantees an <strong>upper bound</strong> on the running time, so users know the algorithm will <em>never</em> exceed that limit.</p>
<p>Best-case is often trivially fast (e.g., already sorted). Average-case requires statistical assumptions about input distribution that may not hold. Worst-case gives a <strong>reliable, pessimistic guarantee</strong> — critical in systems where predictability matters (e.g., real-time software, databases).</p>`,

"List any two properties of Algorithm.":
`<p><strong>1. Finiteness:</strong> An algorithm must terminate after a finite number of steps for all valid inputs.</p>
<p><strong>2. Definiteness (Unambiguity):</strong> Each step must be precisely and clearly defined — no room for interpretation.</p>
<p>Other properties include: Input, Output, and Effectiveness.</p>`,

"Why do we need Asymptotic notation?":
`<p>Asymptotic notation lets us <strong>compare algorithms independently of hardware, language, or constants</strong>. It expresses how runtime or memory grows relative to input size (n).</p>
<p>For example, O(n log n) is always better than O(n²) for large n, regardless of the specific machine. This helps choose the best algorithm before implementation.</p>`,

"What is Class P problem?":
`<p>Class <strong>P (Polynomial time)</strong> is the set of problems that can be <strong>solved</strong> in polynomial time O(n^k) by a deterministic Turing machine.</p>
<p>Examples: Sorting, Shortest Path (Dijkstra), Binary Search. These are considered "efficiently solvable" problems. Class NP contains problems <em>verifiable</em> in polynomial time; P ⊆ NP, but whether P = NP is unsolved.</p>`,

"Explain Worst-Case time complexity.":
`<p><strong>Worst-case time complexity</strong> is the maximum time an algorithm takes for any input of size n — the least-favourable scenario.</p>
<p><strong>Why it matters:</strong> It gives a guaranteed upper bound. Algorithms are judged by their worst-case to ensure reliability.</p>
<p><strong>Example — Linear Search:</strong> Worst case is when the target is at the last position or not present → O(n).</p>
<p><strong>Example — Binary Search:</strong> Worst case → O(log n), even when target is not found.</p>
<p>Expressed using <strong>Big O notation</strong>, which ignores constants: O(n), O(n²), O(log n), etc.</p>`,

"Why is computational complexity performed? Illustrate the concept of Big Oh notation with pictorial representation.":
`<p><strong>Why computational complexity?</strong> To predict resource usage (time, memory) before running — helping choose the most efficient algorithm.</p>
<span class="ans-section-title">Big O Notation</span>
<p>Big O describes the <strong>upper bound</strong> of growth rate. f(n) = O(g(n)) means: ∃ constants c > 0, n₀ such that f(n) ≤ c·g(n) for all n ≥ n₀.</p>
<span class="ans-section-title">Common complexities (best → worst)</span>
<div class="code-block">O(1)      → Constant   — array access
O(log n)  → Logarithm  — binary search
O(n)      → Linear     — linear search
O(n log n)→ Log-linear — merge sort
O(n²)     → Quadratic  — bubble sort
O(2ⁿ)    → Exponential — brute-force subset</div>
<p>On a graph, the y-axis is time, x-axis is n. O(1) is a flat line; O(n²) curves steeply upward.</p>`,

"What do you mean by worst case?":
`<p>Worst case is the input scenario that causes an algorithm to take the <strong>maximum possible time</strong>.</p>
<p><strong>Example:</strong> In linear search, worst case is when the element is at the end or absent → O(n) comparisons.</p>`,

"Explain big omega.":
`<p><strong>Big Omega (Ω)</strong> notation provides the <strong>lower bound</strong> of an algorithm's running time.</p>
<p>f(n) = Ω(g(n)) means f(n) grows <em>at least as fast</em> as g(n). There exist constants c > 0, n₀ such that f(n) ≥ c·g(n) for all n ≥ n₀.</p>
<p><strong>Example:</strong> Any comparison-based sorting algorithm is Ω(n log n) — no such algorithm can do better in the worst case.</p>
<p>Ω gives the best-case guarantee, complementing O (upper bound) and Θ (tight bound).</p>`,

"What is logarithmic complexity?":
`<p>An algorithm with <strong>O(log n)</strong> complexity reduces the problem size by a constant factor each step (usually halving it).</p>
<p><strong>Example:</strong> Binary Search — with 1,000,000 elements, it takes at most ~20 comparisons (log₂ 1,000,000 ≈ 20). Extremely efficient for large n.</p>`,

// ── ADT ──
"Define Abstract Data Type.":
`<p>An <strong>Abstract Data Type (ADT)</strong> is a mathematical model for a data type where the <strong>data values and operations</strong> are defined without specifying implementation details.</p>
<p>It defines <em>what</em> operations do, not <em>how</em> they do it. Examples: Stack ADT (push, pop, peek), Queue ADT (enqueue, dequeue), List ADT.</p>
<p>ADTs support <strong>encapsulation</strong> and <strong>information hiding</strong> — users interact only through a defined interface.</p>`,

"Define abstract data type.":
`<p>An <strong>Abstract Data Type (ADT)</strong> defines a data structure by its <strong>behaviour (operations)</strong>, not its implementation.</p>
<p>Example: Stack ADT defines push(), pop(), isEmpty() — without saying whether it uses an array or linked list internally.</p>`,

"What is a data structure?":
`<p>A <strong>data structure</strong> is a way of <strong>organising, storing, and managing data</strong> in a computer so it can be accessed and modified efficiently.</p>
<p>Types: <strong>Linear</strong> (Array, Stack, Queue, Linked List) and <strong>Non-linear</strong> (Tree, Graph, Heap). Choice of data structure directly affects algorithm performance.</p>`,

"How is a linear data structure different from non-linear?":
`<p><strong>Linear:</strong> Elements are arranged sequentially — each element has exactly one predecessor and one successor (except first/last). Examples: Array, Stack, Queue, Linked List. Traversal is in one pass.</p>
<p><strong>Non-linear:</strong> Elements have a hierarchical or network relationship — one element can connect to many others. Examples: Tree (hierarchy), Graph (network). Traversal requires BFS/DFS.</p>`,

"Differentiate between data type and ADT.":
`<p><strong>Data Type:</strong> A primitive type built into the language (int, float, char). Specifies values and operations at the language level. E.g., int supports +, -, *, /.</p>
<p><strong>ADT:</strong> A user-defined concept that specifies a set of values and operations <em>abstractly</em>, without revealing the implementation. E.g., Stack ADT — defined by push/pop, implementable via array or linked list.</p>
<p>Key difference: Data type is concrete; ADT is an abstraction contract.</p>`,

"How can linked list be considered as an abstract data type?":
`<p>A Linked List is an ADT because it is defined by its <strong>operations</strong> — not the underlying implementation:</p>
<p>Operations: insert(pos, val), delete(pos), search(val), traverse(), isEmpty().</p>
<p>Users interact only through these operations. The internal structure (node pointers, memory layout) is hidden. The same interface works whether implemented with singly, doubly, or circular nodes.</p>`,

"What is ADT?":
`<p>ADT (Abstract Data Type) is a type defined by its <strong>logical behaviour</strong> (set of values + operations) rather than its implementation. It is a theoretical concept used to specify data structures. Example: Queue ADT → enqueue, dequeue, front, isEmpty.</p>`,

// ── LINKED LIST ──
"Draw a doubly linked list.":
`<p>A doubly linked list has nodes with <strong>three fields</strong>: prev pointer, data, next pointer.</p>
<div class="code-block">NULL ← [prev|10|next] ↔ [prev|20|next] ↔ [prev|30|next] → NULL</div>
<p>Each node points to both its <strong>predecessor</strong> (prev) and <strong>successor</strong> (next), allowing traversal in both directions.</p>`,

"What are the advantages of doubly linked list over single linked list?":
`<p>1. <strong>Bidirectional traversal</strong> — can move forward and backward.</p>
<p>2. <strong>Easier deletion</strong> — no need to track previous node; use the prev pointer directly.</p>
<p>3. <strong>Efficient insertion before a node</strong> — O(1) with a reference to that node.</p>
<p>4. Can implement deque (double-ended queue) efficiently.</p>`,

"Define skip list.":
`<p>A <strong>skip list</strong> is a probabilistic data structure built on top of a sorted linked list with <strong>multiple levels of linked lists</strong>. Higher levels act as express lanes skipping over multiple nodes.</p>
<p>Search, insert, delete: O(log n) expected time. Used as an alternative to balanced BSTs. Each element is promoted to higher levels with probability p (usually 0.5).</p>`,

"What is skip list?":
`<p>A skip list is a layered linked list where each level is a sorted subset of the level below. The top level has fewest nodes; the bottom has all. This allows O(log n) average search — similar to binary search on a linked list.</p>`,

"Write any one limitation of circular linked list.":
`<p>The main limitation is that <strong>traversal can cause infinite loops</strong> if not implemented carefully — there is no NULL end to detect termination. The code must keep track of the starting node to know when it has completed a full cycle.</p>`,

"How do you create a node in singly linked list?":
`<div class="code-block">class Node {
    int data;
    Node next;
    Node(int val) {
        data = val;
        next = null;
    }
}</div>
<p>To create: <code>Node newNode = new Node(10);</code> — allocates a node with data=10 and next=null.</p>`,

"Write an algorithm to delete an item in doubly linked list.":
`<span class="ans-section-title">Algorithm: Delete node with value key</span>
<div class="code-block">1. If head == null, return (empty list)
2. curr = head
3. While curr != null AND curr.data != key:
      curr = curr.next
4. If curr == null: key not found, return
5. If curr.prev != null: curr.prev.next = curr.next
   Else: head = curr.next   // deleting head
6. If curr.next != null: curr.next.prev = curr.prev
7. curr = null (free node)</div>
<p>Time complexity: O(n) for search + O(1) for deletion.</p>`,

"What is singly linked list? Write an algorithm to insert a node at the start and end.":
`<p>A <strong>singly linked list</strong> is a linear data structure where each node has data and a next pointer to the following node. Last node's next = null.</p>
<span class="ans-section-title">Insert at Start</span>
<div class="code-block">newNode.next = head
head = newNode</div>
<span class="ans-section-title">Insert at End</span>
<div class="code-block">If head == null: head = newNode; return
curr = head
While curr.next != null: curr = curr.next
curr.next = newNode
newNode.next = null</div>`,

"Write a Java function to insert a node at the specified position of a singly linked list.":
`<div class="code-block">void insertAt(int pos, int data) {
    Node newNode = new Node(data);
    if (pos == 1) {
        newNode.next = head;
        head = newNode; return;
    }
    Node curr = head;
    for (int i = 1; i < pos - 1 && curr != null; i++)
        curr = curr.next;
    if (curr == null) { System.out.println("Invalid position"); return; }
    newNode.next = curr.next;
    curr.next = newNode;
}</div>`,

"Write a Java function to insert a node at the specified position of a doubly linked list.":
`<div class="code-block">void insertAt(int pos, int data) {
    Node newNode = new Node(data);
    if (pos == 1) {
        newNode.next = head;
        if (head != null) head.prev = newNode;
        head = newNode; return;
    }
    Node curr = head;
    for (int i = 1; i < pos - 1 && curr != null; i++)
        curr = curr.next;
    if (curr == null) return;
    newNode.next = curr.next;
    newNode.prev = curr;
    if (curr.next != null) curr.next.prev = newNode;
    curr.next = newNode;
}</div>`,

"Write an algorithm to add a node at end and delete a node from beginning of doubly linked list.":
`<span class="ans-section-title">Insert at End</span>
<div class="code-block">newNode.prev = tail
newNode.next = null
If tail != null: tail.next = newNode
Else: head = newNode
tail = newNode</div>
<span class="ans-section-title">Delete from Beginning</span>
<div class="code-block">If head == null: return
temp = head
head = head.next
If head != null: head.prev = null
Else: tail = null
free(temp)</div>`,

"Write an algorithm to delete a node at nth position in doubly linked list.":
`<div class="code-block">1. If head == null: return
2. curr = head
3. For i = 1 to n-1: curr = curr.next
4. If curr == null: invalid position
5. If curr.prev != null: curr.prev.next = curr.next
   Else: head = curr.next
6. If curr.next != null: curr.next.prev = curr.prev
7. Free curr</div>`,

// ── STACK ──
"Define stack.":
`<p>A <strong>stack</strong> is a linear data structure that follows the <strong>LIFO (Last In, First Out)</strong> principle. The last element inserted is the first to be removed.</p>
<p>Operations: push (insert), pop (remove top), peek/top (view top), isEmpty. Example: function call stack, undo operations.</p>`,

"List the applications of stack.":
`<p>1. <strong>Expression evaluation and conversion</strong> (infix → postfix)</p>
<p>2. <strong>Function call management</strong> (call stack)</p>
<p>3. <strong>Undo/Redo</strong> in editors</p>
<p>4. <strong>Backtracking</strong> (maze solving, DFS)</p>
<p>5. <strong>Syntax checking</strong> (bracket matching)</p>`,

"What is stack? Why is it LIFO? Write algorithms for PUSH, POP and DISPLAY on stack.":
`<p>A <strong>stack</strong> is a linear data structure where insertion and deletion happen at the same end (the <strong>top</strong>). It is LIFO because the last item pushed is the first popped — like a stack of plates.</p>
<span class="ans-section-title">PUSH</span>
<div class="code-block">PUSH(stack, top, MAX, item):
  if top == MAX-1: print "Overflow"; return
  top = top + 1
  stack[top] = item</div>
<span class="ans-section-title">POP</span>
<div class="code-block">POP(stack, top):
  if top == -1: print "Underflow"; return
  item = stack[top]
  top = top - 1
  return item</div>
<span class="ans-section-title">DISPLAY</span>
<div class="code-block">DISPLAY(stack, top):
  if top == -1: print "Stack empty"; return
  for i = top down to 0:
    print stack[i]</div>`,

"Write a function or an algorithm for pop operation in stack.":
`<div class="code-block">int pop() {
    if (top == -1) {
        System.out.println("Stack Underflow");
        return -1;
    }
    return stack[top--];
}</div>`,

"Write an algorithm for pop operation in stack.":
`<div class="code-block">POP(stack, top):
  If top == -1: print "Underflow"; return
  item = stack[top]
  top = top - 1
  return item</div>`,

"Write a program in Java to create stack (Pop operation only).":
`<div class="code-block">class Stack {
    int[] stack = new int[100];
    int top = -1;

    void push(int val) { stack[++top] = val; }

    int pop() {
        if (top == -1) {
            System.out.println("Stack Underflow");
            return -1;
        }
        return stack[top--];
    }

    public static void main(String[] args) {
        Stack s = new Stack();
        s.push(10); s.push(20); s.push(30);
        System.out.println(s.pop()); // 30
        System.out.println(s.pop()); // 20
    }
}</div>`,

"Write a Java program to show the push and pop operations in a stack.":
`<div class="code-block">class Stack {
    int[] arr = new int[50];
    int top = -1;

    void push(int val) {
        if (top == arr.length - 1) { System.out.println("Overflow"); return; }
        arr[++top] = val;
        System.out.println(val + " pushed");
    }

    int pop() {
        if (top == -1) { System.out.println("Underflow"); return -1; }
        return arr[top--];
    }

    public static void main(String[] args) {
        Stack s = new Stack();
        s.push(5); s.push(10); s.push(15);
        System.out.println("Popped: " + s.pop()); // 15
    }
}</div>`,

"Write an algorithm to push() and pop() data from Stack.":
`<span class="ans-section-title">Push</span>
<div class="code-block">If top == MAX-1: Overflow error; return
top++
stack[top] = data</div>
<span class="ans-section-title">Pop</span>
<div class="code-block">If top == -1: Underflow error; return
data = stack[top]
top--
return data</div>`,

"Define overflow and underflow.":
`<p><strong>Overflow:</strong> Occurs when you try to push an element onto a full stack (or insert into a full data structure). top = MAX-1 and push is called.</p>
<p><strong>Underflow:</strong> Occurs when you try to pop from an empty stack. top = -1 and pop is called.</p>`,

"Write down the algorithm for push operation in a stack.":
`<div class="code-block">PUSH(stack, top, MAX, item):
  if top >= MAX - 1:
    print "Stack Overflow"
    return
  top = top + 1
  stack[top] = item</div>`,

"Define java.util.Stack.":
`<p><code>java.util.Stack</code> is a class in Java that extends <code>Vector</code> and implements a LIFO stack.</p>
<p>Key methods: <code>push(E item)</code>, <code>pop()</code>, <code>peek()</code>, <code>isEmpty()</code>, <code>search(Object o)</code>.</p>
<p>Example: <code>Stack&lt;Integer&gt; s = new Stack&lt;&gt;(); s.push(10); s.pop();</code></p>`,

// ── QUEUE ──
"What is a priority queue?":
`<p>A <strong>priority queue</strong> is a queue where each element has a <strong>priority value</strong>. Elements are served in order of priority (highest first), not FIFO order.</p>
<p>Implementation: Binary Heap. Use cases: CPU scheduling, Dijkstra's algorithm, Huffman coding.</p>`,

"What is enqueue and dequeue operation?":
`<p><strong>Enqueue:</strong> Inserts an element at the <strong>rear</strong> of the queue. Time: O(1).</p>
<p><strong>Dequeue:</strong> Removes an element from the <strong>front</strong> of the queue. Time: O(1).</p>
<p>Both are fundamental operations in the Queue ADT, implementing FIFO (First In First Out) behaviour.</p>`,

"What is rear and front in queue?":
`<p><strong>Front:</strong> The index/pointer to the element to be removed next (dequeue). It represents the head of the queue.</p>
<p><strong>Rear:</strong> The index/pointer where the next element will be inserted (enqueue). It represents the tail of the queue.</p>`,

"Mention the drawback of linear queue. Write possible solution.":
`<p><strong>Drawback:</strong> Once rear reaches the last index, no more elements can be inserted even if the front has been dequeued, leaving empty spaces unused ("false overflow").</p>
<p><strong>Solution:</strong> Use a <strong>Circular Queue</strong> — rear wraps around to index 0 after reaching the last index using modulo arithmetic: <code>rear = (rear + 1) % MAX</code>.</p>`,

"Explain different applications of queue.":
`<p>1. <strong>CPU Scheduling</strong> — FCFS scheduling uses a queue of processes.</p>
<p>2. <strong>Printer Spooling</strong> — print jobs queued in order.</p>
<p>3. <strong>BFS traversal</strong> — graph traversal uses a queue.</p>
<p>4. <strong>Network Packet Handling</strong> — data packets buffered in queues.</p>
<p>5. <strong>Ticket Booking Systems</strong> — customers served in FIFO order.</p>`,

"Illustrate the use of priority queue with an example.":
`<p>A priority queue serves the element with the <strong>highest priority</strong> first, regardless of insertion order.</p>
<span class="ans-section-title">Example — Hospital Emergency</span>
<div class="code-block">Insert: (Patient A, priority 3), (Patient B, priority 1), (Patient C, priority 5)
Heap after inserts: C(5) → A(3) → B(1)
Dequeue order: C, A, B  (highest priority first)</div>
<p><strong>Implementation:</strong> Binary Max-Heap. Enqueue: O(log n), Dequeue: O(log n).</p>
<p>Used in Dijkstra's shortest path, Huffman encoding, task scheduling.</p>`,

"Write a function or an algorithm for enqueue operation in circular queue.":
`<div class="code-block">enqueue(queue, rear, front, MAX, item):
  if (rear + 1) % MAX == front:
    print "Queue Full (Overflow)"
    return
  rear = (rear + 1) % MAX
  queue[rear] = item</div>`,

"Write algorithm for enqueue operation in a simple queue.":
`<div class="code-block">enqueue(item):
  if rear == MAX - 1:
    print "Queue Overflow"
    return
  if front == -1: front = 0
  rear = rear + 1
  queue[rear] = item</div>`,

"Write an algorithm to insert an item in queue.":
`<div class="code-block">enqueue(item):
  if rear == MAX - 1: print "Overflow"; return
  if front == -1: front = 0
  rear++
  queue[rear] = item</div>`,

"Define Circular queue. How does circular queue overcome the limitation of linear queue?":
`<p>A <strong>Circular Queue</strong> is a queue where the last position connects back to the first position, forming a circle.</p>
<p><strong>Limitation of linear queue:</strong> When rear reaches the end (index MAX-1), no more insertions are allowed even if the front has moved (wasted space = "false overflow").</p>
<p><strong>Solution:</strong> In circular queue, rear = (rear+1)%MAX — so it wraps around and reuses the vacated front positions.</p>
<div class="code-block">Condition Full:  (rear + 1) % MAX == front
Condition Empty: front == -1</div>`,

"What are the advantages of a circular queue over the linear queue?":
`<p>1. <strong>Eliminates false overflow</strong> — front positions are reused after dequeue.</p>
<p>2. <strong>Memory efficient</strong> — no wasted space.</p>
<p>3. Allows continuous operation without resetting indices.</p>
<p>4. <strong>Better for fixed-size buffers</strong> — used in OS scheduling, network buffers.</p>`,

"What are the conditions to check whether a linear queue and stack is empty and full?":
`<p><strong>Stack:</strong><br>Empty: top == -1 | Full: top == MAX-1</p>
<p><strong>Linear Queue:</strong><br>Empty: front == -1 (or front > rear) | Full: rear == MAX-1</p>`,

"List the application of priority queue.":
`<p>1. <strong>Dijkstra's algorithm</strong> — min-heap for shortest path.</p>
<p>2. <strong>Huffman encoding</strong> — min-heap to build optimal tree.</p>
<p>3. <strong>CPU task scheduling</strong> — high-priority tasks first.</p>
<p>4. <strong>A* search algorithm</strong> — path-finding in AI.</p>
<p>5. <strong>Event-driven simulation</strong> — processing events by timestamp.</p>`,

// ── RECURSION ──
"What do you mean by tail recursion?":
`<p><strong>Tail recursion</strong> is a form of recursion where the <strong>recursive call is the last operation</strong> in the function — nothing happens after it returns.</p>
<p>Tail-recursive functions can be optimised by compilers into iteration (tail call optimisation), saving stack space.</p>
<p><strong>Example (factorial):</strong></p>
<div class="code-block">int fact(int n, int acc) {
    if (n == 0) return acc;
    return fact(n - 1, n * acc); // tail call
}</div>`,

"Define tail recursion.":
`<p>Tail recursion is when the recursive call is the <strong>very last statement</strong> of a function. The result is returned directly without further computation. This allows compilers to replace the call stack with iteration, using O(1) space instead of O(n).</p>`,

"List any two disadvantages of recursion.":
`<p>1. <strong>Stack Overflow risk</strong> — deep recursion fills the call stack and may crash the program.</p>
<p>2. <strong>Overhead</strong> — each function call adds a stack frame (return address, parameters), making recursion slower than equivalent iterative solutions for large inputs.</p>`,

"Write an algorithm to find the factorial of n number using recursion.":
`<div class="code-block">factorial(n):
  if n == 0 OR n == 1: return 1
  return n * factorial(n - 1)</div>
<span class="ans-section-title">Trace for n=4</span>
<div class="code-block">factorial(4) = 4 * factorial(3)
             = 4 * 3 * factorial(2)
             = 4 * 3 * 2 * factorial(1)
             = 4 * 3 * 2 * 1 = 24</div>`,

"Write a Java program to find nth term of Fibonacci series using recursive function.":
`<div class="code-block">class Fibonacci {
    static int fib(int n) {
        if (n <= 1) return n;
        return fib(n - 1) + fib(n - 2);
    }
    public static void main(String[] args) {
        int n = 7;
        System.out.println("Fib(" + n + ") = " + fib(n)); // 13
    }
}</div>
<p>Time: O(2ⁿ) (exponential). Use memoisation for O(n).</p>`,

"How do you compute factorial of any given positive integer using tail recursion?":
`<div class="code-block">int factTail(int n, int acc) {
    if (n == 0) return acc;
    return factTail(n - 1, n * acc);
}
// Call: factTail(5, 1) → 120</div>
<p>The accumulator carries the running result. The recursive call is the last operation → tail recursive → O(1) stack if optimised.</p>`,

"Compute the factorial of given number using tail recursion.":
`<div class="code-block">int factorial(int n, int accumulator) {
    if (n == 0) return accumulator;
    return factorial(n - 1, n * accumulator);
}
// Usage: factorial(5, 1) = 120</div>`,

"Write a recursive algorithm or function to compute GCD of any two positive integers.":
`<div class="code-block">int gcd(int a, int b) {
    if (b == 0) return a;
    return gcd(b, a % b);
}
// Example: gcd(48, 18)
// gcd(18, 12) → gcd(12, 6) → gcd(6, 0) → 6</div>
<p>Based on <strong>Euclid's algorithm</strong>: gcd(a, b) = gcd(b, a mod b). Time: O(log(min(a,b))).</p>`,

"Define nested recursion.":
`<p>In <strong>nested recursion</strong>, the argument to the recursive call is itself a recursive call.</p>
<div class="code-block">int ackermann(int m, int n) {
    if (m == 0) return n + 1;
    if (n == 0) return ackermann(m - 1, 1);
    return ackermann(m - 1, ackermann(m, n - 1)); // nested!
}</div>
<p>The Ackermann function is the classic example — it grows extremely fast and demonstrates non-primitive recursive functions.</p>`,

// ── TREES ──
"Define a balanced tree.":
`<p>A <strong>balanced tree</strong> is a BST where the difference in height between the left and right subtrees of <em>any node</em> is at most 1 (the balance factor).</p>
<p>Ensures O(log n) search, insert, delete. Examples: AVL Tree, Red-Black Tree.</p>`,

"What do you mean by tail recursion?":
`<p>Tail recursion is when the recursive call is the last action in the function — no computation after it. Enables compiler optimisation (tail call elimination) to avoid stack growth.</p>`,

"Define hashing.":
`<p><strong>Hashing</strong> is a technique to map data (keys) to specific positions in a hash table using a <strong>hash function</strong>: index = hash(key) % tableSize.</p>
<p>Goal: O(1) average time for search, insert, delete. Collisions (two keys mapping to same index) are handled by chaining or open addressing.</p>`,

"What is hashing?":
`<p>Hashing is a process of converting a key into an index using a hash function, to store/retrieve values in a hash table efficiently. Average case: O(1) for all operations. Collisions occur when two keys produce the same hash.</p>`,

"What do you mean by degree of a vertex?":
`<p>The <strong>degree of a vertex</strong> in a graph is the <strong>number of edges incident to it</strong> (the count of its neighbours).</p>
<p>In a <strong>directed graph</strong>: In-degree (edges coming in) and Out-degree (edges going out). Sum of all degrees = 2 × number of edges (Handshaking Lemma).</p>`,

"List any two sorting algorithms.":
`<p>1. <strong>Quick Sort</strong> — Divide and conquer; picks a pivot, partitions array, recursively sorts. Average: O(n log n).</p>
<p>2. <strong>Merge Sort</strong> — Divide and conquer; splits array in half, merges sorted halves. Always O(n log n).</p>`,

"Why is Huffman algorithm needed?":
`<p>Huffman algorithm produces an <strong>optimal prefix-free binary encoding</strong> for characters based on their frequencies — more frequent characters get shorter codes, less frequent get longer.</p>
<p>This results in <strong>lossless data compression</strong>. Used in ZIP files, JPEG, MP3. Without it, all characters use fixed-length codes (e.g., 8-bit ASCII), wasting space.</p>`,

"Write a function to traverse a binary tree in Preorder.":
`<div class="code-block">void preorder(Node root) {
    if (root == null) return;
    System.out.print(root.data + " "); // Visit
    preorder(root.left);               // Left
    preorder(root.right);              // Right
}</div>
<p><strong>Order:</strong> Root → Left → Right. Used for copying a tree or prefix expression.</p>`,

"Define an AVL tree. Construct an AVL tree from: 14, 16, 22, 19, 15, 12, 21.":
`<p>An <strong>AVL tree</strong> is a self-balancing BST where the <strong>balance factor</strong> (BF = height(left) − height(right)) of every node must be −1, 0, or +1. Rotations (LL, RR, LR, RL) restore balance after each insertion.</p>
<span class="ans-section-title">Step-by-step insertion trace</span>
<div class="code-block">Insert 14: root=14 ✓
Insert 16: 14[R=16], BF(14)=-1 ✓
Insert 22: 14→16→22, BF(14)=-2, BF(16)=-1 → RR rotation (left-rotate at 14)
           → root=16, L=14, R=22
Insert 19: 19&lt;22→L of 22. Tree: 16[L=14, R=22[L=19]] BF(22)=+1, BF(16)=-1 ✓
Insert 15: 15&gt;14→R of 14. Tree: 16[L=14[R=15], R=22[L=19]] BF(16)=0 ✓
Insert 12: 12&lt;14→L of 14. Tree: 16[L=14[L=12,R=15], R=22[L=19]] BF(16)=+1 ✓
Insert 21: 21&gt;19→R of 19. Tree: 16[L=14[L=12,R=15], R=22[L=19[R=21]]]
           BF(22)=+2, BF(19)=-1 → LR case at 22
           LR: left-rotate at 19, then right-rotate at 22
           → 21 takes 22's R-child position; 19 becomes L of 21; 22 becomes R of 21
           → 21[L=19, R=22] replaces R of 16

Final AVL tree (verified BF ∈ {-1,0,+1} for every node):
           16
         /    \
       14      21
      /  \    /  \
    12   15  19  22</div>`,

"Define an AVL tree. Obtain AVL tree by inserting: 150, 155, 160, 115, 110, 140, 120, 145, 130, 147, 170, 180.":

"What is binary search tree?":
`<p>A <strong>Binary Search Tree (BST)</strong> is a binary tree where:</p>
<p>• Left child < Parent < Right child (for all nodes)</p>
<p>Search, insert, delete: O(log n) average, O(n) worst (unbalanced).</p>`,

"What is heap?":
`<p>A <strong>heap</strong> is a complete binary tree satisfying the <strong>heap property</strong>:</p>
<p><strong>Max-Heap:</strong> Every parent ≥ its children. Root is the maximum.</p>
<p><strong>Min-Heap:</strong> Every parent ≤ its children. Root is the minimum.</p>
<p>Implemented as an array. Used for priority queues and Heap Sort.</p>`,

"Define max heap with example.":
`<p>A <strong>max-heap</strong> is a complete binary tree where every parent node's value ≥ its children's values. The root holds the maximum.</p>
<div class="code-block">Array: [90, 80, 70, 40, 50, 60, 30]
Tree:
        90
      /    \
    80      70
   /  \    /  \
  40   50 60   30</div>`,

"Define min-heap.":
`<p>A <strong>min-heap</strong> is a complete binary tree where every parent ≤ its children. The root is the minimum element. Dequeue always gives the smallest element. Used in Dijkstra's and priority queues.</p>`,

"Demonstrate the level of the binary tree.":
`<div class="code-block">Level 0 (root):          10
Level 1:              20       30
Level 2:           40   50  60   70</div>
<p>Level of a node = its depth from root. Root is at level 0. Height = max level = log₂(n) for a complete binary tree with n nodes.</p>`,

"What is multiway tree?":
`<p>A <strong>multiway tree</strong> (m-way tree) allows each node to have <strong>up to m children</strong> and m-1 keys. Used for disk-based storage.</p>
<p>A <strong>B-tree of order m</strong> is a balanced m-way tree. Every internal node has ⌈m/2⌉ to m children. Guarantees O(log n) search even with millions of records (fewer disk reads).</p>`,

"Define expression tree with example.":
`<p>An <strong>expression tree</strong> is a binary tree where leaf nodes are <strong>operands</strong> and internal nodes are <strong>operators</strong>.</p>
<div class="code-block">Expression: (A + B) * C
Tree:
       *
      / \
     +   C
    / \
   A   B
Inorder  → A + B * C (infix)
Preorder → * + A B C (prefix)
Postorder→ A B + C * (postfix)</div>`,

"What is complete binary tree and strictly binary tree?":
`<p><strong>Complete Binary Tree:</strong> All levels except possibly the last are completely filled; last level has nodes filled from left to right.</p>
<p><strong>Strictly Binary Tree (Full Binary Tree):</strong> Every node has either 0 or exactly 2 children — no node with only one child.</p>`,

"List out the practical applications of tree data structure.":
`<p>1. <strong>File systems</strong> — directory hierarchy.</p>
<p>2. <strong>Databases</strong> — B-trees/B+ trees for indexing.</p>
<p>3. <strong>Compilers</strong> — expression trees, parse trees.</p>
<p>4. <strong>Networking</strong> — spanning trees in routing protocols.</p>
<p>5. <strong>AI</strong> — decision trees, game trees (minimax).</p>`,

"Define B tree.":
`<p>A <strong>B-tree of order m</strong> is a self-balancing m-way search tree where:</p>
<p>• Each node has at most m children and m-1 keys.</p>
<p>• Each internal node has at least ⌈m/2⌉ children.</p>
<p>• All leaves are at the same level (balanced).</p>
<p>Used in databases and file systems for efficient disk access.</p>`,

"Define Balance Factor.":
`<p><strong>Balance Factor (BF)</strong> = Height(Left Subtree) − Height(Right Subtree).</p>
<p>For an AVL tree, BF ∈ {−1, 0, +1} for every node. If BF < −1 or BF > +1, the tree is unbalanced and requires rotation. BF = 0 means equal height subtrees.</p>`,

"Write Java function for pre order traversal in a BST.":
`<div class="code-block">void preOrder(Node root) {
    if (root == null) return;
    System.out.print(root.data + " ");
    preOrder(root.left);
    preOrder(root.right);
}</div>
<p>Order: Visit → Left → Right</p>`,

"Write Java function for post order traversal in a BST.":
`<div class="code-block">void postOrder(Node root) {
    if (root == null) return;
    postOrder(root.left);
    postOrder(root.right);
    System.out.print(root.data + " ");
}</div>
<p>Order: Left → Right → Visit. Used to delete a tree or evaluate postfix expressions.</p>`,

"Why do we need to balance BST?":
`<p>An unbalanced BST can degrade to a <strong>linked list</strong> (e.g., inserting sorted data), making all operations O(n) instead of O(log n).</p>
<p>Balancing guarantees height ≈ log₂(n), ensuring O(log n) search, insert, and delete — essential for performance with large datasets.</p>`,

"Create binary tree of strings \"apple\", \"ball\", \"cat\" and \"ant\".":
`<div class="code-block">Insert apple (root)
Insert ball: ball > apple → right
Insert cat:  cat > apple, cat > ball → right of ball
Insert ant:  ant > apple? No → left

Tree:
        apple
       /     \
     ant     ball
               \

"Explain insertion and deletion in Binary Search Tree with examples.":
`<span class="ans-section-title">Insertion</span>
<p>Start at root. Go left if key < node, right if key > node. Insert when null is reached.</p>
<div class="code-block">Insert 40 into BST {50,30,70}:
40 < 50 → go left → 40 > 30 → go right → insert
Result: 30→right=40</div>
<span class="ans-section-title">Deletion (3 cases)</span>
<p><strong>Case 1 — Leaf node:</strong> Simply remove it.</p>
<p><strong>Case 2 — One child:</strong> Replace node with its child.</p>
<p><strong>Case 3 — Two children:</strong> Find in-order successor (smallest in right subtree), replace node's data, delete successor.</p>
<div class="code-block">Delete 50 from BST {50,30,70,60,80}:
In-order successor of 50 = 60
Replace 50 with 60, delete 60 from right subtree
Result: root=60, left=30, right=70→right=80</div>`,

"Explain insertion and deletion operation in BST.":
`<p><strong>Insert:</strong> Compare with current node; go left if smaller, right if larger; insert at null position.</p>
<p><strong>Delete:</strong> Three cases — (1) leaf: remove directly; (2) one child: bypass node; (3) two children: replace with in-order successor and delete it.</p>`,

"How can you delete a node in a BST?":
`<p><strong>Case 1 (Leaf):</strong> Remove node, set parent's pointer to null.</p>
<p><strong>Case 2 (One child):</strong> Link parent directly to the child.</p>
<p><strong>Case 3 (Two children):</strong> Find the <strong>in-order successor</strong> (leftmost node of right subtree), copy its data to the current node, then delete the successor.</p>`,

"Construct tree for given inorder: DGBAHEICF and postorder: GDBHIEFCA.":

"Create the Huffman code of given characters with frequencies: A:2, B:3, C:5, D:4.":
`<span class="ans-section-title">Build Huffman Tree (always merge the 2 smallest)</span>
<div class="code-block">Frequencies sorted: A(2), B(3), D(4), C(5)

Step 1: Merge A(2) + B(3) = N1(5)
        Heap: [D(4), C(5), N1(5)]

Step 2: Merge D(4) + C(5) = N2(9)   ← D is smallest; C and N1 tied at 5, take C
        Heap: [N1(5), N2(9)]

Step 3: Merge N1(5) + N2(9) = root(14)

Huffman Tree:
          14
         /  \
       N1(5) N2(9)
       /  \   /  \
      A    B D    C
      2    3 4    5

Codes (0 = left branch, 1 = right branch):
  A = 00   (2 bits)
  B = 01   (2 bits)
  D = 10   (2 bits)
  C = 11   (2 bits)

Total encoded bits = 2×2 + 3×2 + 4×2 + 5×2 = 28 bits
Fixed 3-bit encoding = (2+3+4+5)×3 = 42 bits
Space saved = 42 − 28 = 14 bits (33% compression)</div>`,

Heap: BD(4), A(5), C(6)

Step 2: BD(4)+A(5) = BDA(9)
Heap: C(6), BDA(9)

Step 3: C(6)+BDA(9) = root(15)

        B   D
        1   3

Codes: C=0, A=11, B=100, D=101

Original (fixed 3-bit): 15 × 3 = 45 bits
Huffman: 5×2 + 1×3 + 6×1 + 3×3 = 10+3+6+9 = 28 bits
Reduction = 45 - 28 = 17 bits (~37.8% compression)</div>`,

`<p>An <strong>AVL tree</strong> is a height-balanced BST where |BF| ≤ 1 for every node. Four rotation types restore balance:</p>
<p><strong>LL:</strong> Right rotate at unbalanced node.</p>
<p><strong>RR:</strong> Left rotate at unbalanced node.</p>
<p><strong>LR:</strong> Left rotate child, then right rotate node.</p>
<p><strong>RL:</strong> Right rotate child, then left rotate node.</p>

`<span class="ans-section-title">B-Tree Deletion Steps</span>
<p><strong>Case 1 (Leaf with spare keys):</strong> Simply delete the key.</p>
<p><strong>Case 2 (Leaf with minimum keys):</strong> Borrow from a sibling (rotate through parent), or merge with sibling + parent key.</p>
<p><strong>Case 3 (Internal node):</strong> Replace with in-order predecessor/successor, then delete that from the leaf.</p>

`<p><strong>BST:</strong> Binary — each node has exactly 1 key and up to 2 children. Unbalanced in worst case.</p>
<p><strong>Multiway/B-tree:</strong> Each node can have multiple keys (m-1 max) and multiple children (m max). Always balanced. Better for disk storage.</p>

"List any two sorting algorithms.":
`<p>1. <strong>Bubble Sort</strong> — O(n²) comparisons, simple but slow.</p>
<p>2. <strong>Quick Sort</strong> — O(n log n) average, O(n²) worst. In-place divide-and-conquer.</p>`,

"Write the application of Spanning tree.":
`<p>1. <strong>Network design</strong> — minimum cost connections (MST for roads, cables, pipelines).</p>
<p>2. <strong>Broadcast routing</strong> — spanning trees used to broadcast packets without loops.</p>
<p>3. <strong>Network reliability</strong> — ensure all nodes connected with minimum edges.</p>`,

"Which data structures are used for BFS and DFS?":
`<p><strong>BFS (Breadth First Search):</strong> Uses a <strong>Queue</strong> — explores level by level.</p>
<p><strong>DFS (Depth First Search):</strong> Uses a <strong>Stack</strong> (or recursion's call stack) — goes deep before backtracking.</p>`,

"What is a cut vertex?":
`<p>A <strong>cut vertex (articulation point)</strong> is a vertex whose removal <strong>disconnects</strong> the graph (increases the number of connected components).</p>
<p>Example: In a network, cut vertices are critical nodes — their failure would break connectivity. Found using DFS.</p>`,

"What is a cut edge?":
`<p>A <strong>cut edge (bridge)</strong> is an edge whose removal <strong>disconnects</strong> the graph. If removed, at least two previously-connected nodes become unreachable from each other.</p>`,

"What is a spanning tree?":
`<p>A <strong>spanning tree</strong> of a connected graph G is a subgraph that:</p>
<p>• Includes all vertices of G.</p>
<p>• Has exactly (V-1) edges (no cycles).</p>
<p>• Is connected.</p>
<p>A <strong>Minimum Spanning Tree (MST)</strong> has the smallest total edge weight.</p>`,

"What do you mean by minimum spanning tree?":
`<p>A <strong>Minimum Spanning Tree (MST)</strong> is a spanning tree of a weighted graph with the <strong>minimum possible total edge weight</strong>.</p>
<p>Algorithms: Kruskal's (sort edges, add if no cycle) and Prim's (grow tree greedily from a start node). Both give O(E log V) time.</p>`,

"Explain Breadth First Traversal of a graph.":
`<p><strong>BFS</strong> starts at a source vertex and explores all neighbours before moving to the next level. Uses a <strong>Queue</strong> and a visited array.</p>
<span class="ans-section-title">Algorithm</span>
<div class="code-block">BFS(graph, start):
  queue = [start], visited[start] = true
  while queue is not empty:
    v = dequeue()
    print v
    for each neighbour u of v:
      if not visited[u]:
        visited[u] = true
        enqueue(u)</div>
<p>Time: O(V+E). Finds shortest path in unweighted graphs.</p>`,

"Explain Depth First Search (DFS) and Breadth First Search (BFS) with suitable examples.":
`<span class="ans-section-title">BFS</span>
<p>Uses Queue. Explores all vertices at depth d before depth d+1.</p>
<div class="code-block">Graph: 1-2, 1-3, 2-4, 3-5
BFS from 1: 1 → 2 3 → 4 5</div>
<span class="ans-section-title">DFS</span>
<p>Uses Stack (or recursion). Goes as deep as possible before backtracking.</p>
<div class="code-block">DFS from 1: 1 → 2 → 4 → backtrack → 3 → 5</div>
<p>BFS: shortest path, level-order. DFS: cycle detection, topological sort, connected components.</p>`,

"Explain DFS and BFS with examples.":
`<p><strong>BFS:</strong> Queue-based, level-by-level. From vertex A: visit A, then all A's neighbours, then their neighbours.</p>
<p><strong>DFS:</strong> Stack-based (or recursive), depth-first. From vertex A: go as deep as possible along one path before backtracking.</p>
<p>Both run in O(V+E). BFS finds shortest paths in unweighted graphs; DFS is used for cycle detection, topological sorting, and strongly connected components.</p>`,

"What do you mean by adjacency matrix?":
`<p>An <strong>adjacency matrix</strong> is a V×V matrix where entry [i][j] = 1 (or weight) if there is an edge from vertex i to vertex j, else 0.</p>
<div class="code-block">Graph: 1-2, 1-3, 2-3
   1  2  3
1 [0, 1, 1]
2 [1, 0, 1]
3 [1, 1, 0]</div>
<p>Space: O(V²). Fast edge lookup O(1). Not space-efficient for sparse graphs.</p>`,

"What is shortest path problem?":
`<p>The <strong>shortest path problem</strong> finds the minimum-cost path between two vertices in a weighted graph.</p>
<p><strong>Single-source:</strong> Dijkstra's (non-negative weights) — O((V+E) log V), Bellman-Ford (negative weights) — O(VE).</p>
<p><strong>All-pairs:</strong> Floyd-Warshall — O(V³).</p>`,

"Describe Kruskal's algorithm to solve minimum spanning tree problem with a suitable example.":
`<span class="ans-section-title">Kruskal's Algorithm</span>
<div class="code-block">1. Sort all edges by weight (ascending)
2. Use Union-Find to track connected components
3. For each edge (u,v,w) in sorted order:
   if u and v are in different components:
     add edge to MST
     union(u, v)
4. Stop when MST has V-1 edges</div>
<span class="ans-section-title">Example</span>
<div class="code-block">Vertices: A,B,C,D
Edges: A-B(1), A-C(4), B-C(2), B-D(5), C-D(3)
Sorted: A-B(1), B-C(2), C-D(3), A-C(4), B-D(5)
Add A-B(1)✓, Add B-C(2)✓, Add C-D(3)✓
MST = {A-B, B-C, C-D}, Total = 6</div>`,

"What is MST? Explain Kruskal's algorithm. Apply Dijkstra's algorithm on the given graph using source vertex 0.":
`<p><strong>MST</strong> = Minimum Spanning Tree. A tree connecting all V vertices with minimum total edge weight, having exactly V-1 edges.</p>
<span class="ans-section-title">Kruskal's Algorithm</span>
<p>Sort edges by weight. Add edge if it doesn't form a cycle (use Union-Find). Repeat until V-1 edges selected. Time: O(E log E).</p>
<span class="ans-section-title">Dijkstra's Algorithm (from vertex 0)</span>
<div class="code-block">1. dist[0]=0, dist[all others]=∞
2. Use min-priority queue
3. Extract min-dist vertex u
4. For each neighbour v: if dist[u]+w(u,v) < dist[v]:
     dist[v] = dist[u] + w(u,v)
5. Repeat until all vertices processed</div>
<p>Time: O((V+E) log V) with binary heap.</p>`,

"List applications of MST. How does Kruskal's differ from Prim's? Construct MST using Prim's algorithm.":
`<p><strong>MST Applications:</strong> Network cabling, road/pipeline design, cluster analysis, image segmentation.</p>
<p><strong>Kruskal's vs Prim's:</strong></p>
<p>Kruskal's: Edge-based, sorts all edges, uses Union-Find. Better for sparse graphs.</p>
<p>Prim's: Vertex-based, grows tree from one vertex. Better for dense graphs.</p>
<span class="ans-section-title">Prim's Algorithm</span>
<div class="code-block">1. Start with any vertex (say vertex 0)
2. Mark 0 as visited
3. Repeat V-1 times:
   - Find minimum weight edge connecting visited to unvisited vertex
   - Add that edge and the new vertex to MST
   - Mark new vertex as visited</div>`,

"Write algorithm for topological sorting with example. Apply Floyd Warshall Algorithm on the given directed graph.":
`<span class="ans-section-title">Topological Sort (Kahn's Algorithm)</span>
<div class="code-block">1. Compute in-degree for all vertices
2. Enqueue all vertices with in-degree = 0
3. While queue not empty:
   - Dequeue vertex u, add to result
   - For each neighbour v: in-degree[v]--
   - If in-degree[v] == 0: enqueue v
4. If result has V vertices: success, else cycle exists</div>
<span class="ans-section-title">Floyd-Warshall (all-pairs shortest path)</span>
<div class="code-block">Init dist[i][j] = weight(i,j) or ∞ if no edge; dist[i][i]=0
For k = 0 to V-1:       // intermediate vertex
  For i = 0 to V-1:
    For j = 0 to V-1:
      if dist[i][k]+dist[k][j] < dist[i][j]:
        dist[i][j] = dist[i][k]+dist[k][j]
Time: O(V³)</div>`,

"Write the concept of all pair shortest path.":
`<p>The <strong>All-Pairs Shortest Path</strong> problem finds shortest paths between every pair of vertices (i,j) in a weighted graph.</p>
<p><strong>Floyd-Warshall Algorithm:</strong> Dynamic programming. dist[i][j][k] = shortest path from i to j using vertices {1..k} as intermediates. Time: O(V³), Space: O(V²). Handles negative weights (not negative cycles).</p>`,

"Apply Kruskal Algorithm to generate the MST for the given weighted graph.":
`<p>(Since the graph image is referenced in the question, here is the general algorithm with a template example.)</p>
<div class="code-block">Step 1: Sort all edges by weight
Step 2: For each edge in sorted order:
  - If endpoints are in different sets (use Union-Find):
    Add edge to MST
    Union the two sets
Step 3: MST complete when V-1 edges added

Example (4 vertices A,B,C,D):
Edges sorted: A-B(2), A-C(3), B-D(4), C-D(5), B-C(6)
Add A-B(2), A-C(3), B-D(4) → MST weight = 9</div>`,

"Write the algorithm of bubble sort.":
`<div class="code-block">BubbleSort(arr, n):
  for i = 0 to n-2:
    swapped = false
    for j = 0 to n-i-2:
      if arr[j] > arr[j+1]:
        swap arr[j] and arr[j+1]
        swapped = true
    if not swapped: break  // already sorted
Time: O(n²) worst/avg, O(n) best</div>`,

"How does a bubble sort work?":
`<p>Bubble sort repeatedly compares <strong>adjacent elements</strong> and swaps them if in wrong order. After each pass, the largest unsorted element "bubbles up" to its correct position.</p>
<p>Passes: n-1 passes for n elements. Time: O(n²). It is stable and simple but inefficient for large arrays.</p>`,

"How does a selection sort work?":
`<p>Selection sort finds the <strong>minimum element</strong> in the unsorted part and swaps it with the first unsorted element.</p>
<div class="code-block">For i = 0 to n-2:
  minIdx = i
  For j = i+1 to n-1:
    if arr[j] < arr[minIdx]: minIdx = j
  swap arr[i] and arr[minIdx]</div>
<p>Time: O(n²) always. Not stable. Makes O(n) swaps (better than bubble if swaps are expensive).</p>`,

"Write a Java program to sort data using Selection sort algorithm.":
`<div class="code-block">class SelectionSort {
    public static void main(String[] args) {
        int[] arr = {64, 25, 12, 22, 11};
        int n = arr.length;
        for (int i = 0; i < n - 1; i++) {
            int minIdx = i;
            for (int j = i + 1; j < n; j++)
                if (arr[j] < arr[minIdx]) minIdx = j;
            int temp = arr[minIdx];
            arr[minIdx] = arr[i];
            arr[i] = temp;
        }
        for (int x : arr) System.out.print(x + " ");
    }
}</div>`,

"Write a function in Java to sort integers using any algorithm.":
`<div class="code-block">void bubbleSort(int[] arr) {
    int n = arr.length;
    for (int i = 0; i < n - 1; i++) {
        for (int j = 0; j < n - i - 1; j++) {
            if (arr[j] > arr[j + 1]) {
                int temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
            }
        }
    }
}</div>`,

"What are the elementary sorting algorithms?":
`<p>Elementary (simple, O(n²)) sorting algorithms are:</p>
<p>1. <strong>Bubble Sort</strong> — compare & swap adjacent pairs.</p>
<p>2. <strong>Selection Sort</strong> — find min, place at front.</p>
<p>3. <strong>Insertion Sort</strong> — insert each element in sorted position.</p>`,

"Why is sorting required?":
`<p>Sorting organises data in a defined order (ascending/descending), enabling:</p>
<p>1. <strong>Faster searching</strong> — Binary search requires sorted data (O(log n) vs O(n)).</p>
<p>2. <strong>Better presentation</strong> — sorted data is human-readable.</p>
<p>3. <strong>Efficient algorithms</strong> — many algorithms (merge, Kruskal's) require sorted input.</p>`,

"What is stable sort?":
`<p>A <strong>stable sort</strong> preserves the relative order of equal elements. If two elements have the same key, they appear in the output in the same order as in the input.</p>
<p><strong>Stable:</strong> Merge Sort, Bubble Sort, Insertion Sort.</p>
<p><strong>Unstable:</strong> Quick Sort, Heap Sort, Selection Sort.</p>`,

"Write the concept of internal sorting.":
`<p><strong>Internal sorting</strong> is performed when all data fits in <strong>main memory (RAM)</strong>. No disk I/O is needed.</p>
<p>Examples: Quick Sort, Merge Sort, Heap Sort, Insertion Sort. Contrast with <strong>external sorting</strong> (used when data is too large for RAM, e.g., merge-based external sort using disk).</p>`,

// ── SEARCH ──
"How does binary search differ from linear search? Explain.":
`<p><strong>Linear Search:</strong> Checks elements one by one from start. Works on unsorted arrays. Time: O(n).</p>
<p><strong>Binary Search:</strong> Requires <strong>sorted array</strong>. Compares target with middle element; eliminates half of remaining elements each step. Time: O(log n).</p>
<div class="code-block">Linear: [3,1,7,9,2] — search 9: check 3,1,7,9 → 4 comparisons
Binary (sorted [1,2,3,7,9]) — search 9: mid=3, right half, mid=9 → 2 comparisons</div>`,

"Which is more efficient – binary search or linear search? Justify on time complexity.":
`<p><strong>Binary search is more efficient</strong> for large datasets.</p>
<p>Linear search: O(n) — checks every element in worst case.</p>
<p>Binary search: O(log n) — eliminates half the remaining elements each step.</p>
<p>For n=1,000,000: Linear needs up to 1,000,000 comparisons; Binary needs at most 20 (log₂1000000 ≈ 20). Binary search requires sorted data as a prerequisite.</p>`,

"Apply binary search to find 11 in array: 1, 5, 4, 6, 9, 11, 14.":
`<div class="code-block">First sort: [1, 4, 5, 6, 9, 11, 14]
low=0, high=6, target=11

Step 1: mid=3, arr[3]=6 < 11 → low=4
Step 2: mid=5, arr[5]=11 == 11 → FOUND at index 5!</div>
<p>Binary search requires a sorted array. Time: O(log n).</p>`,

"What are the benefits of binary search over linear search algorithm?":
`<p>1. <strong>Time complexity:</strong> O(log n) vs O(n) — dramatically faster for large n.</p>
<p>2. <strong>Fewer comparisons:</strong> Eliminates half the search space each step.</p>
<p>3. Suitable for large sorted datasets (databases, phonebooks, dictionaries).</p>
<p>Limitation: Requires sorted data.</p>`,

"How does binary search differ from linear search in terms of complexity?":
`<p><strong>Linear Search:</strong> O(n) — scans each element. No preprocessing needed. Works on any array.</p>
<p><strong>Binary Search:</strong> O(log n) — requires sorted array. For n=1024: binary search takes max 10 steps vs 1024 for linear.</p>`,

Using stack-based algorithm:

Token  Stack    Output

"Convert the infix expression (A + B) * C into postfix expression.":

Token  Stack   Output

A      [(]     A

"Convert the infix expression A+(B*C)-D to equivalent prefix expression.":

Step 2: Parenthesise: ((A+(B*C))-D)
Step 3: Move operators before operands:

  A+(B*C) → +A*BC
  ((A+(B*C))-D) → -+A*BCD

Prefix: -+A*BCD</div>`,

"What is data structure? Show the status of stack converting infix to postfix: A-B/C*D+E*F/G.":
`<p><strong>Data structure</strong> is a way of organising data in a computer for efficient access and modification. Types: Linear (Array, Stack, Queue, Linked List) and Non-linear (Tree, Graph).</p>
<div class="code-block">Infix: A-B/C*D+E*F/G
(/ and * have higher precedence than - and +)

Token  Stack      Output
A                 A
-      [-]        A
B      [-]        AB
/      [-,/]      AB
C      [-,/]      ABC
*      [-,*]      ABC/    (/ same prec as *, pop /)
D      [-,*]      ABC/D
+      [+]        ABC/D*- (pop * and -)
E      [+]        ABC/D*-E
*      [+,*]      ABC/D*-E
F      [+,*]      ABC/D*-EF
/      [+,/]      ABC/D*-EF* (pop *)
G      [+,/]      ABC/D*-EF*G
End               ABC/D*-EF*G/+

Postfix: ABC/D*-EF*G/+</div>`,

"Evaluate the given postfix expression: 5 2 1 * + 3 –":
`<div class="code-block">Postfix: 5 2 1 * + 3 -
Stack operations:
Push 5 → [5]
Push 2 → [5,2]
Push 1 → [5,2,1]
*: pop 1,2 → 2*1=2, push 2 → [5,2]
+: pop 2,5 → 5+2=7, push 7 → [7]
Push 3 → [7,3]
-: pop 3,7 → 7-3=4, push 4 → [4]
Result = 4</div>`,

"Evaluate the prefix expression: * + 4 / 8 4 3":
`<div class="code-block">Prefix: * + 4 / 8 4 3
Evaluate right to left using stack:

Read 3 → push 3
Read 4 → push 4
Read 8 → push 8
Read / → pop 8,4 → 8/4=2 → push 2
Read 4 → push 4
Read + → pop 4,2 → 4+2=6 → push 6  (wait: + takes top two: 2 and 4)
Actually evaluate prefix left to right recursively:
  *(+(4, /(8,4)), 3)
  = *(+(4, 2), 3)
  = *(6, 3)
  = 18
Result = 18</div>`,

"Evaluate the expression ABCD-*+ using stack where A=20, B=4, C=3, D=7.":
`<div class="code-block">Postfix: A B C D - * +
Substitute: 20 4 3 7 - * +

Push 20 → [20]
Push 4  → [20,4]
Push 3  → [20,4,3]
Push 7  → [20,4,3,7]
-: pop 7,3 → 3-7=-4 → push -4 → [20,4,-4]
*: pop -4,4 → 4*(-4)=-16 → push -16 → [20,-16]
+: pop -16,20 → 20+(-16)=4 → push 4 → [4]

Result = 4</div>`,

"Convert the infix expression to postfix: (A+B)-C*D/E+F-(G*H).":
`<div class="code-block">Infix: (A+B)-C*D/E+F-(G*H)

Token  Stack       Output
(      [(]
A      [(]         A
+      [(,+]       A
B      [(,+]       AB
)      []          AB+
-      [-]         AB+
C      [-]         AB+C
*      [-,*]       AB+C
D      [-,*]       AB+CD
/      [-,/]       AB+CD*   (pop * same prec)
E      [-,/]       AB+CD*E

F      [+]         AB+CD*E/-F
-      [-]         AB+CD*E/-F+  (pop +)

G      [-,(]       AB+CD*E/-F+G

H      [-,(,*]     AB+CD*E/-F+GH
)      [-]         AB+CD*E/-F+GH*
End    []          AB+CD*E/-F+GH*-

Postfix: AB+CD*E/-F+GH*-</div>`,

"Convert the infix expression to postfix using stack: A*(B+C-D)^E/F+G-H*K.":
`<div class="code-block">Precedence: ^ > * / > + - (^ right-associative)

Infix: A*(B+C-D)^E/F+G-H*K

Step through each token:
A → output: A
* → stack: [*]
( → stack: [*,(]
B → output: AB
+ → stack: [*,(,+]
C → output: ABC
- → stack: [*,(,-] (pop +) output: ABC+
D → output: ABC+D
) → pop until (: output: ABC+D-, stack:[*]
^ → stack: [*,^] (^ higher than *)
E → output: ABC+D-E
/ → pop ^ (higher), then check *: * and / same prec, pop *
  output: ABC+D-E^*, stack: [/]
F → output: ABC+D-E^*F
+ → pop /: output: ABC+D-E^*F/+... 
  Actually: stack:[+]
G → output: ...G
- → pop +: output: ...G+, stack:[-]
H → output: ...H
* → stack: [-,*]
K → output: ...K
End → pop all: ...K*-

Postfix: ABC+D-E^*F/G+HK*-</div>`,

"What is hash function?":
`<p>A <strong>hash function</strong> maps a key to a specific index in a hash table: <code>index = hash(key) % tableSize</code>.</p>
<p>Properties of a good hash function: uniform distribution, fast computation, minimal collisions.</p>
<p>Common methods: Division method (k%m), Multiplication method, Folding method.</p>`,

"Define hash table.":
`<p>A <strong>hash table</strong> is a data structure that maps keys to values using a <strong>hash function</strong> for O(1) average-case insert, delete, and search.</p>
<p>When two keys map to the same index (collision), resolved by: <strong>Chaining</strong> (linked list at each slot) or <strong>Open Addressing</strong> (linear/quadratic probing, double hashing).</p>`,

"What is a dynamic list?":
`<p>A <strong>dynamic list</strong> can grow or shrink at runtime — unlike static arrays of fixed size. Implemented using a <strong>linked list</strong> (each node allocated on demand) or a <strong>dynamic array</strong> (doubles capacity when full, e.g., ArrayList in Java). Supports insert and delete anywhere in O(1) to O(n).</p>`,

"Define nested recursion.":
`<p>Nested recursion is when a recursive function's argument is itself a recursive call.</p>
<div class="code-block">int f(int n) {
    if (n > 100) return n - 10;
    return f(f(n + 11)); // nested recursive call
}</div>
<p>The inner call must complete before being used as argument for the outer call. The Ackermann function is the classic example of nested recursion.</p>`,

"What is a linked list?":
`<p>A <strong>linked list</strong> is a linear data structure where elements (nodes) are stored non-contiguously. Each node contains <strong>data</strong> and a <strong>pointer (reference) to the next node</strong>.</p>
<p>Advantages over arrays: Dynamic size, efficient insertion/deletion. Disadvantage: No random access; must traverse from head.</p>`,

"What is tree traversal? What are its types?":
`<p><strong>Tree traversal</strong> is visiting every node exactly once in a specific order.</p>
<p><strong>In-order (LVR):</strong> Left → Visit → Right. For BST: gives sorted order.</p>
<p><strong>Pre-order (VLR):</strong> Visit → Left → Right. Used to copy/serialize a tree.</p>
<p><strong>Post-order (LRV):</strong> Left → Right → Visit. Used to delete a tree.</p>
<p><strong>Level-order (BFS):</strong> Visit level by level using a queue.</p>`,

"Define expression tree.":
`<p>An expression tree is a binary tree representing an arithmetic expression. Leaves = operands (numbers/variables). Internal nodes = operators (+,-,*,/,^). In-order traversal gives infix; pre-order gives prefix; post-order gives postfix.</p>`,

"What is asymptotic notation?":
`<p>Asymptotic notation mathematically describes how an algorithm's time/space grows as input n → ∞. Big O (upper bound), Omega (lower bound), Theta (tight bound). Used to classify and compare algorithm efficiency independently of hardware.</p>`,

"What is a skip list?":
`<p>A skip list is a multi-level linked list that provides O(log n) average search. The bottom layer has all elements; higher layers have randomly selected subsets (like express lanes). Simpler to implement than AVL trees with similar performance.</p>`,

"What is a dynamic list?":
`<p>A dynamic list grows and shrinks at runtime. Implemented as a linked list (pointer-based) or dynamic array (doubles size when full). Unlike static arrays, no pre-declared size limit is needed.</p>`,

// ── PAPER VIEW ───────────────────────────────────────────────────
function showPaper(i, btn) {
  currentPaper = i;
  setActive(btn);
  const p = PAPERS[i];
  const gCls = {A:'g-a',B:'g-b',C:'g-c',D:'g-d'};
  let html = `
    <div class="paper-header">
      <h2>${p.emoji} ${p.college}</h2>
      <div class="paper-meta">
        <span class="pill">📅 ${p.date}</span>
        <span class="pill">⏱ ${p.time}</span>
        <span class="pill">📊 ${p.marks} marks</span>
        <span class="pill">📝 ${p.exam}</span>
      </div>
    </div>
  `;

  p.groups.forEach((grp,gi)=>{
    html += `<div class="group-section">
      <div class="group-header">
        <span class="group-badge ${gCls[grp.g]}">Group ${grp.g}</span>
        <span class="group-note">${grp.note}</span>
      </div>`;
    grp.qs.forEach((item,qi)=>{
      const key=`${i}-${gi}-${qi}`;
      const ytTopic = TOPICS.find(t=>t.name.toLowerCase().includes(item.t.split(' ')[0].toLowerCase()));
      const ytLink = ytTopic
        ? `https://www.youtube.com/results?search_query=${encodeURIComponent(ytTopic.ytq)}`
        : `https://www.youtube.com/results?search_query=${encodeURIComponent(item.t+' data structure algorithm explained')}`;
      html += `
        <div class="q-card" id="card-${key}">
          <div class="q-top" onclick="toggleAns('${key}')">
            <span class="q-num">${qi+1}.</span>
            <div class="q-right">
              <span class="q-text">${item.q}</span>
              <div class="q-actions">
                <button class="btn btn-show" id="btn-${key}" onclick="event.stopPropagation();toggleAns('${key}')">
                  <span id="arrow-${key}">▸</span> Answer
                </button>
                <a class="btn btn-yt" href="${ytLink}" target="_blank" onclick="event.stopPropagation()">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-1.96C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.4 19.54C5.12 20 12 20 12 20s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>
                  YouTube
                </a>
              </div>
            </div>
          </div>
          <div class="ans-panel" id="ans-${key}">
            <div class="ans-panel-inner">
              <div class="ans-label">✏️ Answer</div>
              <div class="ans-body">${getAnswerHTML(item.q)}</div>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  document.getElementById('content').innerHTML = html;
  document.getElementById('content').scrollTop = 0;
}

function toggleAns(key) {
  const panel = document.getElementById('ans-'+key);
  const card = document.getElementById('card-'+key);
  const arrow = document.getElementById('arrow-'+key);
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open', !isOpen);
  card.classList.toggle('open', !isOpen);
  if (arrow) arrow.textContent = isOpen ? '▸' : '▾';
}

"State the difference between stack and queue.":
`<p><strong>Stack:</strong> LIFO (Last In First Out). Insertion and deletion both happen at the <strong>top</strong>. Operations: push, pop.</p>

"Write algorithm for binary search and give its time complexity.":
`<div class="code-block">binarySearch(arr, n, target):

    if arr[mid] == target: return mid
    else if arr[mid] &lt; target: low = mid + 1
    else: high = mid - 1
  return -1  // not found</div>
<p><strong>Time:</strong> O(log n) best/average/worst. <strong>Space:</strong> O(1) iterative, O(log n) recursive.</p>

"What is an AVL tree?":
`<p>An <strong>AVL tree</strong> (Adelson-Velsky and Landis, 1962) is a self-balancing Binary Search Tree where the <strong>balance factor</strong> (BF = height(left) − height(right)) of every node must be −1, 0, or +1. Automatic rotations maintain this property after every insert or delete.</p>`,

"State the four types of AVL rotations.":
`<p><strong>LL Rotation:</strong> Imbalance in left subtree of left child → Single right rotation.</p>
<p><strong>RR Rotation:</strong> Imbalance in right subtree of right child → Single left rotation.</p>
<p><strong>LR Rotation:</strong> Imbalance in right subtree of left child → Left rotate child, then right rotate node.</p>
<p><strong>RL Rotation:</strong> Imbalance in left subtree of right child → Right rotate child, then left rotate node.</p>`,

"Define adjacency list representation.":

1: [0, 2]
2: [0, 1]</div>

"What is a leaf node?":
`<p>A <strong>leaf node</strong> (external node) is a node with <strong>no children</strong> — both left and right child pointers are null.</p>
<p>In a tree with n nodes, a full binary tree has ⌈n/2⌉ leaf nodes. Leaf nodes store actual data in B+ trees.</p>`,
